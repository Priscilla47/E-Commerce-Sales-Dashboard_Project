name: Question
description: Ask how to use the project
title: "question: "
labels: ["question"]
body:
  - type: textarea
    id: question
    attributes:
      label: Your question
      description: What are you trying to do, and what have you tried so far?
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Your data format, command, or anything else that helps. Remove private data.
