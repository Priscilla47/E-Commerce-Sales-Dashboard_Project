name: Feature request
description: Suggest a new feature or an improvement
title: "feat: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or need
      description: What are you trying to do that is hard or impossible today?
      placeholder: "I want to see revenue broken down by country."
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How would you like it to work? Example commands or screens help.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches or workarounds you thought about.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Analytics
        - Data loading and validation
        - Command line
        - Dashboard
        - AI features
        - Documentation
        - Other
    validations:
      required: true
  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution
      options:
        - label: I would be willing to work on this
