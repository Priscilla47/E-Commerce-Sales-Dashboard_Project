[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sales-insights"
dynamic = ["version"]
description = "Explore e-commerce order data from the command line, with a dashboard and AI features planned."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "pandas>=2.0",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "pre-commit>=3.7",
]
dashboard = [
    "streamlit>=1.40",
]

[project.scripts]
sales-insights = "sales_insights.cli.main:main"

[tool.setuptools.dynamic]
version = { attr = "sales_insights.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "."]

[tool.ruff.lint]
# E, W: pycodestyle errors and warnings; F: pyflakes (unused names, undefined names);
# I: import sorting; B: bugbear (likely bugs); UP: use the syntax of the Python version.
select = ["E", "W", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
